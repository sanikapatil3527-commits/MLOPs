name: CI-ML (Day5)

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci-ml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dataset (if needed)
        run: |
          python data/make_dataset.py

      - name: Step 1 - Validate data
        run: |
          python -m src.validate_data

      - name: Step 2 - Train models (MLflow local tracking)
        run: |
          python -m src.train

      - name: Step 3 - Evaluation quality gate
        run: |
          python -m src.evaluate

      - name: Step 4 - Drift gate
        run: |
          python -m src.gates
